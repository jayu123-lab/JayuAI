# ============================================================
# JAYU_JAR — Permisos por acción
# ============================================================
# Clasificación: SAFE | REVIEW | DANGEROUS
#  - SAFE:      no requiere confirmación en ningún modo.
#  - REVIEW:    requiere confirmación en "confirm_before_execution".
#  - DANGEROUS: requiere confirmación explícita SIEMPRE (salvo negación
#               global). En read_only nunca se permite.
#
# El globulamas específico gana. El fallback global es REVIEW.

actions:
  # ---------- SAFE ----------
  "memory.read": SAFE
  "memory.write": SAFE
  "config.read": SAFE
  "system.status": SAFE
  "system.ping": SAFE
  "web.search": SAFE
  "web.read": SAFE
  "market.read": SAFE          # leer cotizaciones/estructura (sin ejecutar)
  "market.quote": SAFE         # cotización puntual (Fase 5)
  "market.rates": SAFE         # velas OHLC
  "market.structure": SAFE     # swings/BOS/CHoCH
  "market.analyze": SAFE       # pipeline completo de análisis
  "market.bias": SAFE          # bias BULLISH/BEARISH/NEUTRAL
  "model.ping": SAFE
  "model.list": SAFE
  "llm.chat": SAFE
  "llm.query": SAFE
  "llm.classify": SAFE

  # ---------- MT5: LECTURA (análisis) SIEMPRE permitida ----------
  "mt5.status": SAFE
  "mt5.account": SAFE
  "mt5.positions_read": SAFE
  "mt5.orders_read": SAFE
  "mt5.symbols": SAFE
  "mt5.quote": SAFE
  "mt5.rates": SAFE
  "mt5.ticks": SAFE
  "mt5.history": SAFE
  "mt5.sizer": SAFE
  "mt5.connect": SAFE          # conectar solo lee (el terminal no opera)

  # ---------- REVIEW ----------
  "config.write": REVIEW
  "skill.install": REVIEW
  "skill.enable": REVIEW
  "code.edit": REVIEW
  "code.run": REVIEW           # ejecutar código propio en sandbox
  "package.install": REVIEW

  # ---------- MT5: EJECUCIÓN (siempre confirmada) ----------
  "mt5.market_order": REVIEW   # abrir orden de mercado
  "mt5.pending_order": REVIEW  # abrir orden pendiente
  "mt5.modify_position": REVIEW
  "mt5.modify_order": REVIEW   # modificar pendiente (SL/TP/precio)
  "mt5.close_position": REVIEW
  "mt5.breakeven": REVIEW
  "mt5.trailing": REVIEW

  "computer.launch": REVIEW
  "computer.keyboard": REVIEW
  "computer.mouse": REVIEW
  "voice.config": REVIEW

  # ---------- DANGEROUS ----------
  "fs.delete": DANGEROUS
  "fs.overwrite_outside_repo": DANGEROUS
  "system.shutdown": DANGEROUS
  "process.kill": DANGEROUS
  "security.modify": DANGEROUS
  "credentials.write": DANGEROUS
  "money.transfer": DANGEROUS
  "trading.autonomous": DANGEROUS   # trading sin confirmación
  "mt5.close_all": DANGEROUS        # cerrar TODAS las posiciones
  "network.firewall": DANGEROUS
  "shell.raw": DANGEROUS

  # globulamas por defecto si no hay regla específica
  "*": REVIEW

# ---------- Modos globales ----------
modes:
  read_only:
    review: deny           # en lectura pura, nada que requiera revisión se ejecuta
    dangerous: deny
  confirm_before_execution:
    review: ask
    dangerous: ask
  autonomous:
    review: allow
    dangerous: ask

# ---------- Sandbox por defecto ----------
# Rutas donde el código ejecutado por JAYU puede escribir.
sandbox_paths:
  - data
  - tests
  - scripts