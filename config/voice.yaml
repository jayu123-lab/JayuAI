# ============================================================
# JayuAI — Configuración de voz (FASE 2 implementada)
# ============================================================
# Pipeline: micrófono -> [VAD] -> faster-whisper (STT local)
#           -> orquestador -> edge-tts (TTS neuronal NATURAL, no robótico)
#           -> altavoz
# Los motores se cargan con import perezoso: si falta una dependencia, la
# skill responde ok=False con el motivo exacto (nunca simula).

enabled: true

pipeline:
  stt:
    engine: faster-whisper    # local; descarga del modelo la 1ª vez (HF)
    model: small              # small/base — es-ES bien soportado en CPU
    device: cpu
    compute_type: int8
    sample_rate: 16000
  vad:
    engine: energy            # VAD por energía (numpy puro, sin deps)
    threshold_db: -35
  tts:
    engine: edge              # edge = neuronal natural | piper = 100% local
    voice: es-MX-DaliaNeural  # voz femenina cálida y fluida
    rate: "+8%"               # respuestas ágiles (no monótonas)
    pitch: "-2Hz"             # tono algo más grave y cálido (no robótico)
    volume: "+0%"
    interruptions: true

behavior:
  speak_replies: true         # la UI reproduce las respuestas en voz alta
  transcribe_input: true      # el chat acepta entrada por micrófono