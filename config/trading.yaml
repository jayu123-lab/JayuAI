# ============================================================
# JAYU_JAR — Configuración de trading (Fase 6 MT5 implementada)
# ============================================================
# La EJECUCIÓN está separada del ANÁLISIS (jayu/mt5/).
#   - ANÁLISIS  -> MT5Connector + PositionSizer (lectura, SAFE)
#   - EJECUCIÓN -> MT5Executor (order_send) SOLO tras política,
#                  confirmación humana y audit_log.
# Por defecto NADA se ejecuta.

mode: READ_ONLY
# READ_ONLY                 -> solo lectura y análisis
# CONFIRM_BEFORE_EXECUTION  -> pedir confirmación en cada orden
# AUTONOMOUS_TRADING        -> DESACTIVADO POR DEFECTO (requiere override)

autonomous_trading_enabled: false      # NUNCA activar por defecto

execution:
  default_magic: 7654321               # magic para órdenes de JAYU
  deviation_points: 20                 # slippage máximo en puntos
  default_comment: "JAYU"              # comentario por defecto de las órdenes
  enable_breakeven: true               # permitir mover SL a breakeven
  enable_trailing: true                # permitir trailing stop

risk:
  max_position_pct_equity: 2.0        # % del capital por posición
  max_open_positions: 5
  max_daily_loss_pct: 3.0             # límite de pérdida diaria
  max_spread_threshold: null          # null = sin límite configurado

# ---------- Fase 8: governor multi-agente ----------
# El governor coordina researcher -> risk_manager -> governor y emite
# PROPUESTAS (REVIEW). NUNCA ejecuta por su cuenta.
governor:
  threshold: 2                 # |score| mínimo del BiasEngine para BULLISH/BEARISH
  propose_trades: true         # emitir propuestas priorizadas (advisory)
  conviction_min: 0.5          # convicción mínima para proponer (0..1)
  take_profit_rr: 1.5          # ratio TP/riesgo en las propuestas
  sl_fallback_atr_mult: 1.5    # SL por ATR si no hay swing válido

mt5:
  symbol_prefix: ""
  account_risk_limit_contact: true    # avisar si se supera límite configurado